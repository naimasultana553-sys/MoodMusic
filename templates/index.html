{% extends 'base.html' %}
{% block title %}MoodMusic ♡ cute vibes{% endblock %}
{% block content %}
<div class="hero-clean bg-white py-4 overflow-hidden">
    <div class="container py-4 text-center">
        <div class="folder-runway mb-4">
            <div class="folder-track-run">
                <div class="mini-folder f1"><i class="bi bi-folder2"></i><span>happy</span></div>
                <div class="mini-folder f2"><i class="bi bi-folder2"></i><span>chill</span></div>
                <div class="mini-folder f3"><i class="bi bi-folder2"></i><span>love</span></div>
                <div class="mini-folder f4"><i class="bi bi-folder2"></i><span>hype</span></div>
                <div class="mini-folder f5"><i class="bi bi-folder2"></i><span>calm</span></div>
                <div class="mini-folder f1"><i class="bi bi-folder2"></i><span>happy</span></div>
                <div class="mini-folder f2"><i class="bi bi-folder2"></i><span>chill</span></div>
                <div class="mini-folder f3"><i class="bi bi-folder2"></i><span>love</span></div>
            </div>
        </div>
        <a href="{{ url_for('predict_page') }}" class="btn cute-btn px-4 py-2">get started <i class="bi bi-arrow-right ms-1"></i></a>
    </div>
</div>
<div class="container py-4">
    <div id="instant" class="row justify-content-center mt-3">
        <div class="col-12 text-center mb-3">
            <h2 class="cute-heading h5 mb-1">instant playback</h2>
            <p class="cute-muted small">soft picks, just for you</p>
        </div>
        <div class="col-12">
            <div id="instant-loading" class="text-center py-3"><div class="spinner-border spinner-border-sm cute-spinner"></div><p class="small cute-muted mt-2">fetching cute tracks…</p></div>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="instant-songs-container"></div>
        </div>
    </div>
</div>
{% endblock %}
