{% extends 'base.html' %}
{% block title %}MoodMusic ♡ cute vibes{% endblock %}
{% block content %}
<div class="hero-image-section position-relative overflow-hidden">
    <img src="{{ url_for('static', filename='images/hero.jpeg') }}" alt="Typography Music" class="hero-bg-img">
    <div class="hero-overlay hero-overlay-light"></div>
    <div class="container position-relative py-5" style="z-index:2;">
        <div class="row justify-content-center text-center py-5">
            <div class="col-auto py-4">
                <a href="{{ url_for('predict_page') }}" class="btn cute-btn px-4 py-2 reveal cute-pulse" style="background:#fff; color:#3a3a42 !important; border-color:#fff; animation-delay:0.2s;">get started <i class="bi bi-arrow-right ms-1"></i></a>
            </div>
        </div>
    </div>
</div>
<div class="container py-4">
    <div id="instant" class="row justify-content-center mt-4 pt-2">
        <div class="col-12 text-center mb-3 reveal-on-scroll">
            <h2 class="cute-heading h5 mb-1">instant playback</h2>
            <p class="cute-muted small">soft picks, just for you</p>
        </div>
        <div class="col-12">
            <div id="instant-loading" class="text-center py-3"><div class="spinner-border spinner-border-sm cute-spinner"></div><p class="small cute-muted mt-2">fetching cute tracks…</p></div>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3" id="instant-songs-container"></div>
        </div>
    </div>
</div>
{% endblock %}
